server.port=8082
management.endpoints.web.base-path=/api/payment/actuator
management.endpoints.web.exposure.include=health,prometheus
spring.application.name=order-payment-service
springdoc.swagger-ui.path=/api/payment/swagger-ui/index.html
springdoc.api-docs.path=/api/payment/v3/api-docs

# IBM MQ
ibm.mq.queueManager=QM1
ibm.mq.channel=DEV.APP.SVRCONN
ibm.mq.connName=${MQ_HOST:localhost}(1414)
ibm.mq.user=${MQ_USER:app}
ibm.mq.password=${MQ_PASSWORD}
app.mq.concurrency=1-3

# Queues owned by this service
# IN  <- confirmed orders arrive from Inventory
app.mq.input-queue=DEV.PAYMENT.QUEUE
# OUT -> forwarded to Notification once payment succeeds
app.mq.output-queue=DEV.NOTIFICATION.QUEUE
# OUT -> used if payment itself fails (Producer consumes this)
app.mq.failed-queue=DEV.ORDER.FAILED.QUEUE
# OUT -> tells Inventory to release the stock it reserved
app.mq.compensate-queue=DEV.INVENTORY.COMPENSATE.QUEUE

# Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:payment_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
