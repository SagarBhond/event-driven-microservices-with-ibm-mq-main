server.port=8083
management.endpoints.web.base-path=/api/notification/actuator
management.endpoints.web.exposure.include=health,prometheus
spring.application.name=order-notification-service
springdoc.swagger-ui.path=/api/notification/swagger-ui/index.html
springdoc.api-docs.path=/api/notification/v3/api-docs

# IBM MQ
ibm.mq.queueManager=QM1
ibm.mq.channel=DEV.APP.SVRCONN
ibm.mq.connName=${MQ_HOST:localhost}(1414)
ibm.mq.user=${MQ_USER:app}
ibm.mq.password=${MQ_PASSWORD}
app.mq.concurrency=1-3

# Queues owned by this service
# IN  <- payment confirmations arrive from Payment
app.mq.input-queue=DEV.NOTIFICATION.QUEUE
# OUT -> tells Producer the whole order finished successfully
app.mq.completed-queue=DEV.ORDER.COMPLETED.QUEUE

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:notification_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
logging.level.com.order.notification=DEBUG

resilience4j.circuitbreaker.instances.notificationDb.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.notificationDb.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.notificationDb.sliding-window-size=5
resilience4j.circuitbreaker.instances.notificationDb.wait-duration-in-open-state=15s

resilience4j.retry.instances.notificationDbRetry.max-attempts=3
resilience4j.retry.instances.notificationDbRetry.wait-duration=2s
